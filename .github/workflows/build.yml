name: Build Rhythm

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Write access, for the release the app updates from (the last step).
    permissions:
      contents: write

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A second of checking against ten minutes of building. Kotlin fails a
      # whole module over one unimported name, and that failure looks exactly
      # like a correct file until the compiler says so - which is why this
      # runs before the build rather than after it.
      - name: Check every name used is imported
        run: python3 tools/check_imports.py

      # The Windows build runs the phone's models converted to ONNX. If the
      # phone's models change and nobody converts them again, the two builds
      # would quietly hear music differently; this says so instead.
      - name: Check the desktop models match the phone's
        run: python3 tools/models/to_onnx.py --check

      - name: Test the music engine
        run: ./gradlew --no-daemon :engine:test

      - name: Upload engine test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports-${{ github.run_number }}
          path: |
            engine/build/reports/tests/test/
            engine/build/test-results/test/
          if-no-files-found: warn

      - name: Prepare signing key (optional)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RHYTHM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RHYTHM_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RHYTHM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RHYTHM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing with the repository keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no KEYSTORE_BASE64 secret found - the release APK is signed with the debug key" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kept in a file as well as on screen. A Gradle log runs to hundreds of
      # lines of environment and post-steps, and the four lines that say what
      # is actually wrong end up in the middle of it where nothing reading the
      # tail will ever see them.
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # Compiles on Linux even though it ships as a Windows MSI - Compose
      # Desktop is cross platform, and only jpackage needs the target OS. So
      # a broken desktop build is caught here on every run rather than at
      # packaging time on a runner we do not start yet.
      - name: Compile the desktop module
        run: |
          set -o pipefail
          ./gradlew --no-daemon :desktop:compileKotlin 2>&1 | tee desktop.log

      # The desktop's models on a known signal, against the phone's TFLite
      # and Essentia's own readings (desktop ModelCheck).
      - name: Test the desktop module
        run: |
          set -o pipefail
          ./gradlew --no-daemon :desktop:test 2>&1 | tee -a desktop.log

      # One grep over both logs put the Android build's output first and the
      # head cut the Kotlin errors off the end, which is how the last run
      # reported a compilation failure without saying what failed. Each log
      # gets its own pass now, and the "e:" lines come before anything else.
      - name: Show the compile errors
        if: failure()
        run: |
          for f in build.log desktop.log; do
            [ -f "$f" ] || continue
            echo "=============== $f ==============="
            grep -E "^e: " "$f" | head -40 || true
            grep -E "^\* What went wrong:" -A 4 "$f" | head -10 || true
          done
          echo "=================================="

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          ls -lh out || true
          # Which key signed it. An update installs over an older copy only
          # when both carry the same certificate, so this has to stay the same
          # from one build to the next.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for apk in out/*.apk; do
            [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256" || true
          done
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "version 1.1.${{ github.run_number }} (build ${{ github.run_number }}), commit ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # Numbered, so a download sitting in a folder still says which build
          # it is. A file called rhythm-apk tells you nothing a month later,
          # and the version inside the APK is only readable once installed.
          name: rhythm-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: warn

      # The release the Android app updates itself from (update/Updater.kt):
      # every build of main, as a GitHub release holding the APK and an
      # update.json that names its version, address and SHA-256. Never from a
      # pull request, and never an APK signed with the debug key - an update
      # signed with another key cannot install over the app, and phones
      # would keep being offered one they cannot take.
      - name: Publish the release the app updates from
        if: github.event_name == 'push' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="1.1.${{ github.run_number }}"
          APK="rhythm-$VERSION.apk"
          cp out/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/$APK"
          printf '{"versionCode": %s, "versionName": "%s", "url": "%s", "sha256": "%s", "size": %s}\n' \
            "${{ github.run_number }}" "$VERSION" "$URL" "$SHA" "$SIZE" > update.json
          cat update.json
          git log -1 --format=%B > notes.txt
          gh release create "v$VERSION" "$APK" update.json \
            --title "Rhythm $VERSION" --notes-file notes.txt --latest
          echo "published release v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure logs
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 "$HOME/.gradle/daemon"/*/daemon-*.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no daemon log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The Windows installer. A separate job because jpackage can only build a
  # package for the machine it runs on - the module itself compiles on Linux
  # in the job above, which is what catches a code error without waiting for
  # a runner to be handed out here.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # jpackage builds the application image - Rhythm.exe, the cut down
      # runtime and the jars - and stops there. It cannot be told to launch
      # the app when an install finishes, because it generates its MSI from a
      # fixed WiX template with no such page and no switch to add one.
      - name: Build the application image
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :desktop:createDistributable "-PrhythmVersion=1.1.${{ github.run_number }}"

      # The same check inside the finished application image, launched the
      # way the installed app is launched: the bundled runtime, the trimmed
      # ONNX Runtime and its Windows DLLs, the models out of the jar. This is
      # the one place a packaging mistake shows before a user finds it.
      - name: Check the models inside the application image
        shell: pwsh
        run: |
          $exe = "$PWD\desktop\build\compose\binaries\main\app\Rhythm\Rhythm.exe"
          $out = "$env:RUNNER_TEMP\model-check.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--check-models=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out; Get-Content $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append } else { Write-Host "no report was written" }
          if ($p.ExitCode -ne 0) { throw "the model check failed (exit code $($p.ExitCode))" }

      - name: Show what jpackage said
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path desktop/build/compose/logs -Recurse -Filter *.txt -ErrorAction SilentlyContinue
          if (-not $logs) { Write-Host "no jpackage logs were written"; exit 0 }
          foreach ($log in $logs) {
            Write-Host "===== $($log.Name) ====="
            Get-Content $log.FullName
          }

      # Not on the runner image, so it is fetched. One line and about a
      # minute, against writing WiX by hand to get the same page.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $image = "$PWD\desktop\build\compose\binaries\main\app\Rhythm"
          $out = "$PWD\desktop\build\installer"
          if (-not (Test-Path $image)) { throw "no application image at $image" }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=1.1.${{ github.run_number }}" `
            "/DSourceDir=$image" `
            "/DOutDir=$out" `
            "desktop\installer\rhythm.iss"

      - name: Collect the installer
        if: always()
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path desktop/build/installer -Filter *.exe -ErrorAction SilentlyContinue
          if ($setup) {
            "### Windows installer" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "version 1.1.${{ github.run_number }}, commit $($env:GITHUB_SHA.Substring(0,7))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $setup | ForEach-Object { "$($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          } else {
            "### Windows installer was not produced" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rhythm-windows-${{ github.run_number }}
          path: desktop/build/installer/*.exe
          if-no-files-found: warn
