name: Build Rhythm APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare signing key (optional)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RHYTHM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RHYTHM_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RHYTHM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RHYTHM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing with the repository keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no KEYSTORE_BASE64 secret found - the release APK is signed with the debug key" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build debug APK
        if: always()
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          ls -lh out || true
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-apk
          path: out/*.apk
          if-no-files-found: warn

      - name: Report failure logs
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 "$HOME/.gradle/daemon"/*/daemon-*.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no daemon log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
