name: Build Rhythm

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare signing key (optional)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RHYTHM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RHYTHM_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RHYTHM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RHYTHM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing with the repository keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no KEYSTORE_BASE64 secret found - the release APK is signed with the debug key" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Compiles on Linux even though it ships as a Windows MSI - Compose
      # Desktop is cross platform, and only jpackage needs the target OS. So
      # a broken desktop build is caught here on every run rather than at
      # packaging time on a runner we do not start yet.
      - name: Compile the desktop module
        run: ./gradlew --no-daemon --stacktrace :desktop:compileKotlin

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          ls -lh out || true
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "version 1.0.${{ github.run_number }} (build ${{ github.run_number }}), commit ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Numbered, so a download sitting in a folder still says which build
          # it is. A file called rhythm-apk tells you nothing a month later,
          # and the version inside the APK is only readable once installed.
          name: rhythm-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: warn

      - name: Report failure logs
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 "$HOME/.gradle/daemon"/*/daemon-*.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no daemon log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The Windows installer. A separate job because jpackage can only build a
  # package for the machine it runs on - the module itself compiles on Linux
  # in the job above, which is what catches a code error without waiting for
  # a runner to be handed out here.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the installer
        shell: pwsh
        run: |
          # The same run number the APK carries, so an MSI and an APK from one
          # run are provably the same code. An MSI version has to be numeric
          # and rise, which is exactly what a run number is.
          #
          # No --stacktrace: when jpackage fails it fails with exit code 1 and
          # writes the reason to a file, so a Gradle stack trace is two hundred
          # lines that say nothing and bury the part that does. The step below
          # prints the file instead.
          .\gradlew.bat --no-daemon :desktop:packageMsi "-PrhythmVersion=1.0.${{ github.run_number }}"

      # jpackage reports "exit code 1" and puts what actually went wrong in a
      # log beside the build output, which nothing reads unless it is asked to.
      - name: Show what jpackage said
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path desktop/build/compose/logs -Recurse -Filter *.txt -ErrorAction SilentlyContinue
          if (-not $logs) { Write-Host "no jpackage logs were written"; exit 0 }
          foreach ($log in $logs) {
            Write-Host "===== $($log.Name) ====="
            Get-Content $log.FullName
          }

      - name: Collect the installer
        if: always()
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path desktop/build/compose/binaries/main/msi -Filter *.msi -ErrorAction SilentlyContinue
          if ($msi) {
            "### Windows installer"      | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "version 1.0.${{ github.run_number }}, commit $($env:GITHUB_SHA.Substring(0,7))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $msi | ForEach-Object { "$($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          } else {
            "### Windows installer was not produced" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-windows-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn
